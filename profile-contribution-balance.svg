<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Public contribution mix</title>
  <desc id="desc">A themed contribution mix chart showing commits, code review, pull requests, and issue work.</desc>
  <rect width="720" height="420" rx="10" fill="#140b12"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="360" y="34" text-anchor="middle" font-size="13" fill="#d3b7aa" letter-spacing="1.2">PUBLIC CONTRIBUTION MIX</text>
    <text x="360" y="55" text-anchor="middle" font-size="11" fill="#8f756f">current signal: build-heavy, with growing public collaboration</text>

    <g stroke-linecap="round">
      <line x1="172" y1="220" x2="548" y2="220" stroke="#f3a7bc" stroke-opacity=".82" stroke-width="2"/>
      <line x1="360" y1="118" x2="360" y2="322" stroke="#f3a7bc" stroke-opacity=".82" stroke-width="2"/>
      <line x1="214" y1="220" x2="506" y2="220" stroke="#d3b7aa" stroke-opacity=".12"/>
      <line x1="360" y1="150" x2="360" y2="290" stroke="#d3b7aa" stroke-opacity=".12"/>
    </g>

    <polygon points="188,220 360,198 391,220 360,250" fill="#f3a7bc" fill-opacity=".24" stroke="#f3a7bc" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="360" cy="220" r="5" fill="#140b12" stroke="#f3a7bc" stroke-width="2"/>
    <circle cx="188" cy="220" r="6" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>
    <circle cx="360" cy="198" r="5.5" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>
    <circle cx="391" cy="220" r="4.5" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>
    <circle cx="360" cy="250" r="5.5" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>

    <text x="92" y="208" text-anchor="middle" font-size="19" fill="#f4c46f">77%</text>
    <text x="92" y="229" text-anchor="middle" font-size="14" fill="#fff4e8">Commits</text>

    <text x="360" y="91" text-anchor="middle" font-size="16" fill="#f4c46f">9%</text>
    <text x="360" y="111" text-anchor="middle" font-size="14" fill="#fff4e8">Code review</text>

    <text x="360" y="354" text-anchor="middle" font-size="17" fill="#f4c46f">14%</text>
    <text x="360" y="375" text-anchor="middle" font-size="14" fill="#fff4e8">Pull requests</text>

    <text x="617" y="217" text-anchor="middle" font-size="14" fill="#fff4e8">Issues</text>
    <text x="617" y="235" text-anchor="middle" font-size="11" fill="#8f756f">watching</text>
  </g>
</svg>
