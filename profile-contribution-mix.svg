<svg width="720" height="360" viewBox="0 0 720 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Public contribution mix</title>
  <desc id="desc">A radar-style x-y graph showing commits, pull requests, code review, and issues.</desc>
  <rect width="720" height="360" rx="10" fill="#140b12"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="360" y="34" text-anchor="middle" font-size="13" fill="#d3b7aa" letter-spacing="1.2">PUBLIC CONTRIBUTION MIX</text>
    <text x="360" y="53" text-anchor="middle" font-size="11" fill="#8f756f">code, review, pull requests, and issue work</text>

    <line x1="126" y1="190" x2="594" y2="190" stroke="#f3a7bc" stroke-width="2" stroke-linecap="round"/>
    <line x1="360" y1="67" x2="360" y2="313" stroke="#f3a7bc" stroke-width="2" stroke-linecap="round"/>

    <line x1="168" y1="190" x2="552" y2="190" stroke="#d3b7aa" stroke-opacity=".12"/>
    <line x1="360" y1="92" x2="360" y2="288" stroke="#d3b7aa" stroke-opacity=".12"/>

    <polygon points="183,190 360,173 377,190 360,207" fill="#f3a7bc" fill-opacity=".28" stroke="#f3a7bc" stroke-width="2" stroke-linejoin="round"/>

    <circle cx="360" cy="190" r="5.5" fill="#140b12" stroke="#f3a7bc" stroke-width="2"/>
    <circle cx="183" cy="190" r="6" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>
    <circle cx="360" cy="173" r="5.5" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>
    <circle cx="377" cy="190" r="4.5" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>
    <circle cx="360" cy="207" r="5.5" fill="#fff4e8" stroke="#f4c46f" stroke-width="2"/>

    <text x="151" y="174" text-anchor="middle" font-size="19" fill="#f4c46f">77%</text>
    <text x="151" y="194" text-anchor="middle" font-size="14" fill="#fff4e8">Commits</text>

    <text x="360" y="84" text-anchor="middle" font-size="16" fill="#f4c46f">9%</text>
    <text x="360" y="103" text-anchor="middle" font-size="14" fill="#fff4e8">Code review</text>

    <text x="360" y="302" text-anchor="middle" font-size="17" fill="#f4c46f">14%</text>
    <text x="360" y="322" text-anchor="middle" font-size="14" fill="#fff4e8">Pull requests</text>

    <text x="618" y="195" text-anchor="middle" font-size="14" fill="#fff4e8">Issues</text>

    <text x="360" y="344" text-anchor="middle" font-size="11" fill="#8f756f">current signal: build-heavy, with growing public collaboration</text>
  </g>
</svg>
